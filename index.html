<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Reader & Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .search-container {
            flex: 1;
            min-width: 250px;
        }

        .search-container input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #e9ecef;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .search-container input:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        button.secondary {
            background: #6c757d;
        }

        button.success {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%);
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #666;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 20px;
            margin: 20px 30px;
            border-radius: 5px;
            border-left: 4px solid #c33;
        }

        .table-container {
            padding: 30px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9em;
            letter-spacing: 0.5px;
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        th:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        th.sortable::after {
            content: ' ⇅';
            opacity: 0.5;
        }

        th.sort-asc::after {
            content: ' ↑';
            opacity: 1;
        }

        th.sort-desc::after {
            content: ' ↓';
            opacity: 1;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e9ecef;
        }

        tbody tr {
            transition: background-color 0.2s;
        }

        tbody tr:hover {
            background-color: #f8f9fa;
        }

        tbody tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        tbody tr:nth-child(even):hover {
            background-color: #e9ecef;
        }

        .stats {
            padding: 20px 30px;
            background: #f8f9fa;
            border-top: 2px solid #e9ecef;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
            padding: 10px 20px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .table-container {
                padding: 15px;
            }

            th, td {
                padding: 8px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 CSV Reader & Display</h1>
            <p>Open Source CSV Data Viewer</p>
        </header>

        <div class="controls">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="🔍 Search table data..." oninput="filterTable()">
            </div>
            <div class="button-group">
                <button id="loadBtn" onclick="loadData()">Load CSV Data</button>
                <button class="success" id="exportBtn" onclick="exportToCSV()" style="display:none;">Export to CSV</button>
                <button class="secondary" onclick="location.reload()">Refresh Page</button>
            </div>
        </div>

        <div id="content">
            <div class="loading">
                Click "Load CSV Data" to display the contents of data.csv
            </div>
        </div>
    </div>

    <script>
        // Global variables to store data
        let globalData = [];
        let currentSortColumn = -1;
        let currentSortOrder = 'asc';

        /**
         * Load CSV data from the PHP backend
         * Fetches data via AJAX and displays it in the table
         */
        function loadData() {
            const contentDiv = document.getElementById('content');
            const loadBtn = document.getElementById('loadBtn');
            
            // Show loading state
            contentDiv.innerHTML = '<div class="loading">Loading CSV data...</div>';
            loadBtn.disabled = true;
            
            // Fetch data from PHP script
            fetch('read.php')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    // Store data globally for sorting/filtering
                    globalData = data;
                    displayData(data);
                    loadBtn.disabled = false;
                    // Show export button once data is loaded
                    document.getElementById('exportBtn').style.display = 'inline-block';
                })
                .catch(error => {
                    contentDiv.innerHTML = `<div class="error">Error loading data: ${error.message}</div>`;
                    loadBtn.disabled = false;
                });
        }

        /**
         * Display CSV data in an HTML table
         * @param {Array} data - 2D array of CSV data (first row is headers)
         */
        function displayData(data) {
            const contentDiv = document.getElementById('content');
            
            if (!data || data.length === 0) {
                contentDiv.innerHTML = '<div class="loading">No data found in CSV file</div>';
                return;
            }

            // First row is headers
            const headers = data[0];
            const rows = data.slice(1);

            // Build table with sortable headers
            let tableHTML = '<div class="table-container"><table id="dataTable"><thead><tr>';
            
            headers.forEach((header, index) => {
                tableHTML += `<th class="sortable" onclick="sortTable(${index})">${header}</th>`;
            });
            
            tableHTML += '</tr></thead><tbody>';
            
            // Build table rows
            rows.forEach(row => {
                tableHTML += '<tr>';
                row.forEach(cell => {
                    tableHTML += `<td>${cell}</td>`;
                });
                tableHTML += '</tr>';
            });
            
            tableHTML += '</tbody></table></div>';

            // Add statistics
            tableHTML += `
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value">${headers.length}</div>
                        <div class="stat-label">Columns</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="rowCount">${rows.length}</div>
                        <div class="stat-label">Rows</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${headers.length * rows.length}</div>
                        <div class="stat-label">Total Cells</div>
                    </div>
                </div>
            `;

            contentDiv.innerHTML = tableHTML;
        }

        /**
         * Sort table by column
         * @param {number} columnIndex - Index of the column to sort by
         */
        function sortTable(columnIndex) {
            if (globalData.length === 0) return;

            const headers = globalData[0];
            let rows = globalData.slice(1);

            // Toggle sort order if clicking the same column
            if (currentSortColumn === columnIndex) {
                currentSortOrder = currentSortOrder === 'asc' ? 'desc' : 'asc';
            } else {
                currentSortOrder = 'asc';
                currentSortColumn = columnIndex;
            }

            // Sort rows
            rows.sort((a, b) => {
                let aVal = a[columnIndex];
                let bVal = b[columnIndex];

                // Try to convert to numbers for numeric sorting
                const aNum = parseFloat(aVal);
                const bNum = parseFloat(bVal);

                if (!isNaN(aNum) && !isNaN(bNum)) {
                    return currentSortOrder === 'asc' ? aNum - bNum : bNum - aNum;
                }

                // String comparison
                aVal = String(aVal).toLowerCase();
                bVal = String(bVal).toLowerCase();

                if (currentSortOrder === 'asc') {
                    return aVal.localeCompare(bVal);
                } else {
                    return bVal.localeCompare(aVal);
                }
            });

            // Update global data with sorted rows
            globalData = [headers, ...rows];
            displayData(globalData);

            // Update header styling to show sort indicator
            updateSortIndicators(columnIndex);
        }

        /**
         * Update visual indicators on table headers to show sort status
         * @param {number} sortedColumn - Index of the currently sorted column
         */
        function updateSortIndicators(sortedColumn) {
            const headers = document.querySelectorAll('#dataTable th');
            headers.forEach((header, index) => {
                header.classList.remove('sort-asc', 'sort-desc');
                if (index === sortedColumn) {
                    header.classList.add(currentSortOrder === 'asc' ? 'sort-asc' : 'sort-desc');
                }
            });
        }

        /**
         * Filter table rows based on search input
         * Searches across all columns and hides non-matching rows
         */
        function filterTable() {
            const searchInput = document.getElementById('searchInput');
            const filter = searchInput.value.toLowerCase();
            const table = document.getElementById('dataTable');
            
            if (!table) return;

            const tbody = table.getElementsByTagName('tbody')[0];
            const rows = tbody.getElementsByTagName('tr');
            let visibleCount = 0;

            // Loop through all table rows (except header)
            for (let i = 0; i < rows.length; i++) {
                const row = rows[i];
                const cells = row.getElementsByTagName('td');
                let found = false;

                // Search in all cells of the row
                for (let j = 0; j < cells.length; j++) {
                    const cell = cells[j];
                    if (cell) {
                        const textValue = cell.textContent || cell.innerText;
                        if (textValue.toLowerCase().indexOf(filter) > -1) {
                            found = true;
                            break;
                        }
                    }
                }

                // Show or hide row based on search match
                if (found) {
                    row.style.display = '';
                    visibleCount++;
                } else {
                    row.style.display = 'none';
                }
            }

            // Update row count to show filtered results
            const rowCountElement = document.getElementById('rowCount');
            if (rowCountElement) {
                rowCountElement.textContent = visibleCount;
            }
        }

        /**
         * Export the current table data (including filtered/sorted) to CSV file
         * Downloads the CSV file to the user's computer
         */
        function exportToCSV() {
            if (globalData.length === 0) {
                alert('No data to export');
                return;
            }

            // Get only visible rows if filtering is active
            const table = document.getElementById('dataTable');
            const searchFilter = document.getElementById('searchInput').value;
            
            let dataToExport;
            
            if (searchFilter && table) {
                // Export only visible (filtered) rows
                dataToExport = [globalData[0]]; // Headers
                const rows = table.getElementsByTagName('tbody')[0].getElementsByTagName('tr');
                
                for (let i = 0; i < rows.length; i++) {
                    if (rows[i].style.display !== 'none') {
                        const cells = rows[i].getElementsByTagName('td');
                        const rowData = [];
                        for (let j = 0; j < cells.length; j++) {
                            rowData.push(cells[j].textContent);
                        }
                        dataToExport.push(rowData);
                    }
                }
            } else {
                // Export all data
                dataToExport = globalData;
            }

            // Convert array to CSV string
            const csvContent = dataToExport.map(row => {
                return row.map(cell => {
                    // Escape quotes and wrap in quotes if contains comma, quote, or newline
                    const cellStr = String(cell);
                    if (cellStr.includes(',') || cellStr.includes('"') || cellStr.includes('\n')) {
                        return '"' + cellStr.replace(/"/g, '""') + '"';
                    }
                    return cellStr;
                }).join(',');
            }).join('\n');

            // Create download link and trigger download
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            link.setAttribute('href', url);
            link.setAttribute('download', 'exported_data_' + new Date().getTime() + '.csv');
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
