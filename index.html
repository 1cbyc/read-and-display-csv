<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Reader & Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #666;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 20px;
            margin: 20px 30px;
            border-radius: 5px;
            border-left: 4px solid #c33;
        }

        .table-container {
            padding: 30px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9em;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e9ecef;
        }

        tbody tr {
            transition: background-color 0.2s;
        }

        tbody tr:hover {
            background-color: #f8f9fa;
        }

        tbody tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        tbody tr:nth-child(even):hover {
            background-color: #e9ecef;
        }

        .stats {
            padding: 20px 30px;
            background: #f8f9fa;
            border-top: 2px solid #e9ecef;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
            padding: 10px 20px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .table-container {
                padding: 15px;
            }

            th, td {
                padding: 8px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 CSV Reader & Display</h1>
            <p>Open Source CSV Data Viewer</p>
        </header>

        <div class="controls">
            <button id="loadBtn" onclick="loadData()">Load CSV Data</button>
            <button onclick="location.reload()" style="margin-left: 10px; background: #6c757d;">Refresh Page</button>
        </div>

        <div id="content">
            <div class="loading">
                Click "Load CSV Data" to display the contents of data.csv
            </div>
        </div>
    </div>

    <script>
        function loadData() {
            const contentDiv = document.getElementById('content');
            const loadBtn = document.getElementById('loadBtn');
            
            // Show loading state
            contentDiv.innerHTML = '<div class="loading">Loading CSV data...</div>';
            loadBtn.disabled = true;
            
            // Fetch data from PHP script
            fetch('read.php')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    displayData(data);
                    loadBtn.disabled = false;
                })
                .catch(error => {
                    contentDiv.innerHTML = `<div class="error">Error loading data: ${error.message}</div>`;
                    loadBtn.disabled = false;
                });
        }

        function displayData(data) {
            const contentDiv = document.getElementById('content');
            
            if (!data || data.length === 0) {
                contentDiv.innerHTML = '<div class="loading">No data found in CSV file</div>';
                return;
            }

            // First row is headers
            const headers = data[0];
            const rows = data.slice(1);

            // Build table
            let tableHTML = '<div class="table-container"><table><thead><tr>';
            
            headers.forEach(header => {
                tableHTML += `<th>${header}</th>`;
            });
            
            tableHTML += '</tr></thead><tbody>';
            
            rows.forEach(row => {
                tableHTML += '<tr>';
                row.forEach(cell => {
                    tableHTML += `<td>${cell}</td>`;
                });
                tableHTML += '</tr>';
            });
            
            tableHTML += '</tbody></table></div>';

            // Add statistics
            tableHTML += `
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value">${headers.length}</div>
                        <div class="stat-label">Columns</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${rows.length}</div>
                        <div class="stat-label">Rows</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${headers.length * rows.length}</div>
                        <div class="stat-label">Total Cells</div>
                    </div>
                </div>
            `;

            contentDiv.innerHTML = tableHTML;
        }
    </script>
</body>
</html>
