<!DOCTYPE html>
<!-- I am considering making this an upload space for csv files then, then the read.php file would run a double operation instead. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Reader & Display v3.0</title>
    <style>
        /* ... (keeping all your existing styles) ... */
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>&#128202; CSV Reader & Display v3.0</h1>
            <p>Advanced CSV Data Manager</p>
            <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark Mode">&#9789;</button>
        </header>

        <div class="upload-container">
            <input type="file" id="fileUpload" accept=".csv" multiple onchange="handleFileUpload(event)">
            <button onclick="document.getElementById('fileUpload').click()">&#128193; Upload CSV</button>
            <div class="file-list" id="fileList"></div>
        </div>

        <div class="controls">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="&#128269; Search table data..." oninput="filterTable()">
            </div>
            <div class="button-group">
                <button id="loadBtn" onclick="loadData()">Load Default CSV</button>
                <button class="success" id="exportBtn" onclick="exportToCSV()" style="display:none;">&#128190; Export CSV</button>
                <button class="secondary" onclick="window.print()">&#128424; Print</button>
                <button class="secondary" onclick="location.reload()">&#8635; Refresh</button>
            </div>
        </div>

        <div class="toolbar">
            <div class="undo-redo">
                <button onclick="undo()" id="undoBtn" disabled title="Undo (Ctrl+Z)">&#8630; Undo</button>
                <button onclick="redo()" id="redoBtn" disabled title="Redo (Ctrl+Y)">&#8631; Redo</button>
            </div>
            <button onclick="addNewRow()">&#10133; Add Row</button>
            <button class="danger" onclick="deleteSelectedRows()" id="deleteBtn" disabled>&#128465; Delete Selected</button>
            <div class="column-toggle">
                <button onclick="toggleColumnDropdown()">&#128065; Columns</button>
                <div class="column-dropdown" id="columnDropdown"></div>
            </div>
            <button onclick="toggleAdvancedFilters()">&#128270; Advanced Filters</button>
            <button onclick="toggleChart()">&#128200; Chart View</button>
            <select id="rowsPerPage" onchange="changeRowsPerPage()">
                <option value="10">10 rows</option>
                <option value="25">25 rows</option>
                <option value="50" selected>50 rows</option>
                <option value="100">100 rows</option>
                <option value="-1">All rows</option>
            </select>
        </div>

        <div class="advanced-filters" id="advancedFilters">
            <div id="filterRows"></div>
            <button onclick="addFilterRow()">&#10133; Add Filter</button>
            <button class="secondary" onclick="clearFilters()">Clear All</button>
            <button class="success" onclick="applyAdvancedFilters()">Apply Filters</button>
        </div>

        <div class="chart-container" id="chartContainer">
            <h2 style="text-align:center; margin-bottom: 20px;">Data Visualization</h2>
            <div class="chart" id="chart">
                <canvas id="chartCanvas"></canvas>
            </div>
            <div style="text-align:center; margin-top: 15px;">
                <select id="chartType" onchange="updateChart()">
                    <option value="bar">Bar Chart</option>
                    <option value="line">Line Chart</option>
                    <option value="pie">Pie Chart</option>
                </select>
                <select id="chartColumn" onchange="updateChart()"></select>
            </div>
        </div>

        <div id="content">
            <div class="loading">
                Click "Load Default CSV" or upload your own CSV file to begin
            </div>
        </div>

        <div class="pagination" id="pagination" style="display:none;">
            <button onclick="goToPage(1)">&laquo;</button>
            <button onclick="goToPage(currentPage - 1)">&lsaquo;</button>
            <span class="page-info" id="pageInfo">Page 1 of 1</span>
            <button onclick="goToPage(currentPage + 1)">&rsaquo;</button>
            <button onclick="goToPage(totalPages)">&raquo;</button>
        </div>
    </div>

    <script>
        // ... (keeping all your existing JavaScript) ...
    </script>
</body>
</html>
